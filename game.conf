# headless_maps converts and bakes every own and foreign map: sharded in four (about 100 maps at 35 s each).
GAME_NAME="Murder Mystery"
PACK="murder"
EXTRA_PACKS="murder_maps:murder-mystery-maps hideseek_maps:hide-n-seek-maps"
SUITES="headless_config headless_workbench headless_mapcfg headless_run headless_maps headless_mapdrop headless_bots headless_net dedicated headless_native_motor headless_native_doors headless_native_sight headless_touch"
SOAK_ARG="MAP"
SUITE_TIMEOUTS="headless_maps=1800"
SUITE_SHARDS="headless_maps=m0,m1,m2,m3"
FEATURES="soak defs suite_timeouts suite_shards"
DEFS_ACH="res://game/mm_progress.gd:catalogue"
